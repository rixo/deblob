<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
</head>
<body>
<div id="dc-root"></div>
<script>
// Page logic is created here, not in the runtime module: a dynamic import()
// inside it resolves against the script that made the function, and an inline
// script has the page's base URL — as their support.js does, served beside the page.
window.__dcFunction = (...args) => new Function(...args)
</script>
<script type="module" src="/main.js"></script>
</body>
</html>
