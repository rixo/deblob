// Map (Session 49 as Map - Gravity, renamed Session 52): the map as the
// component deblob mounts. Standalone it is the map with a project picker
// (no bar: Tweaks only); embedded (`embedded` prop, Deblob Map Host) the host

// camera. Contract: props src | graph-data, sel (id | ids), depth, focus,
// centre, chain, dirs, flow, arrows, cmd ({ n, op }), view-store ({ load,
// save }), active (keys); callbacks on-select(ids), on-hover(id),
