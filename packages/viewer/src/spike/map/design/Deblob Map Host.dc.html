<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet data-dc-atomics>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&amp;family=IBM+Plex+Sans:wght@400;500;600&amp;display=swap">
<script src="highlight-model.js"></script>
<script src="map-theme.js"></script>
<script src="graph-router.js"></script>
<script src="call-stack.js"></script>
<script src="map-consts.js"></script>
<script src="map-layout.js?v=43"></script>
<script src="map-router.js"></script>
<script src="map-paint.js?v=42"></script>
<script src="map-tween.js"></script>
<style>
/* Titles centre on their x-height, not the line box (Plex Sans ink sits low). Progressive: no support, no change. */
@supports (text-box-trim: trim-both) { [data-ink] { text-box-trim: trim-both; text-box-edge: ex alphabetic } }
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#141518;color:#e6e4df;font-family:'IBM Plex Sans',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
a{color:#c4c2bc;text-decoration:none}a:hover{color:#f4f2ec}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
</style>
</helmet>
<div style="position:fixed;inset:0;display:flex;flex-direction:column;background:{{ schemeBg }}">

  <div style="flex:1;display:flex;flex-direction:column;min-height:0">

    <main data-map="canvas" onPointerDown="{{ onDown }}" onPointerMove="{{ onMove }}" onPointerUp="{{ onUp }}" onDoubleClick="{{ onDbl }}" onContextMenu="{{ onCtx }}" onMouseOver="{{ onOver }}" onMouseLeave="{{ onOut }}" style="flex:1;min-height:0;position:relative;overflow:hidden;user-select:none;-webkit-user-select:none;background-color:#121316;background-image:radial-gradient(#24262b 1px,transparent 1px);background-size:20px 20px;background-position:{{ gridPos }};cursor:{{ cursor }}">

      <div style="position:absolute;inset:0;pointer-events:none;isolation:isolate">
        <canvas data-map="arrowsLo" style="position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none;z-index:{{ cvLoZ }}"></canvas>
        <canvas data-map="arrowsHi" style="position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none;z-index:{{ cvHiZ }}"></canvas>
        <div data-map="cam" style="position:absolute;left:0;top:0;z-index:0;transform:{{ cam }};transform-origin:0 0;pointer-events:{{ camPE }}">

      <sc-for list="{{ edgeLayers }}" as="L" hint-placeholder-count="0">
      <svg style="position:absolute;left:0;top:0;width:1px;height:1px;overflow:visible;pointer-events:none;z-index:{{ L.z }}">
          <g opacity="{{ L.op }}">
          <sc-for list="{{ L.items }}" as="e" hint-placeholder-count="0">
            <g opacity="{{ e.op }}">
              <path d="{{ e.d }}" fill="none" stroke="#121316" stroke-width="{{ e.hsw }}" stroke-linejoin="round" stroke-linecap="{{ e.cap }}" opacity="{{ e.haloOp }}"></path>
              <path data-node="{{ e.id }}" d="{{ e.d }}" fill="none" stroke="transparent" stroke-width="15" onClick="{{ e.onClick }}" style="pointer-events:{{ e.pe }};cursor:pointer"></path>
              <path d="{{ e.ln }}" fill="none" stroke="{{ e.color }}" stroke-width="{{ e.sw }}" stroke-dasharray="{{ e.dash }}" stroke-linejoin="round" stroke-linecap="{{ e.cap }}"></path>
              <path d="{{ e.head }}" fill="{{ e.color }}"></path>
            </g>
          </sc-for>
          <sc-for list="{{ L.hits }}" as="e" hint-placeholder-count="0">
            <path data-node="{{ e.id }}" d="{{ e.d }}" fill="none" stroke="transparent" stroke-width="15" onClick="{{ e.onClick }}" style="pointer-events:{{ e.pe }};cursor:pointer"></path>
          </sc-for>
          <sc-for list="{{ L.plain }}" as="e" hint-placeholder-count="0">
            <path d="{{ e.d }}" fill="none" stroke="{{ e.color }}" stroke-width="{{ e.sw }}" stroke-dasharray="{{ e.dash }}" stroke-linejoin="round" opacity="{{ e.op }}"></path>
            <path d="{{ e.head }}" fill="{{ e.color }}" opacity="{{ e.op }}"></path>
          </sc-for>
          <sc-for list="{{ L.cuts }}" as="e" hint-placeholder-count="0">
            <path d="{{ e.d }}" fill="none" stroke="#121316" stroke-width="{{ e.hsw }}" opacity="{{ e.op }}"></path>
          </sc-for>
          <sc-for list="{{ L.tops }}" as="e" hint-placeholder-count="0">
            <path d="{{ e.d }}" fill="none" stroke="{{ e.color }}" stroke-width="{{ e.sw }}" stroke-dasharray="{{ e.dash }}" stroke-dashoffset="{{ e.off }}" stroke-linejoin="round" stroke-linecap="{{ e.cap }}" opacity="{{ e.op }}"></path>
          </sc-for>
          </g>
      </svg>
      </sc-for>

      <sc-for list="{{ callLayers }}" as="CL" hint-placeholder-count="0">
      <svg style="position:absolute;left:0;top:0;width:1px;height:1px;overflow:visible;pointer-events:none;z-index:{{ CL.z }}">
        <sc-for list="{{ CL.arcs }}" as="a" hint-placeholder-count="0">
          <g opacity="{{ a.op }}">
            <path d="{{ a.d }}" fill="none" stroke="#121316" stroke-width="{{ a.hsw }}" stroke-linecap="round" opacity="0.8"></path>
            <path d="{{ a.d }}" fill="none" stroke="{{ a.color }}" stroke-width="{{ a.sw }}" stroke-linecap="round"></path>
            <path d="{{ a.head }}" fill="{{ a.color }}"></path>
            <path data-ui="call" d="{{ a.d }}" fill="none" stroke="transparent" stroke-width="11" onMouseEnter="{{ a.onEnter }}" onMouseLeave="{{ a.onLeave }}" onClick="{{ a.onClick }}" style="pointer-events:stroke;cursor:pointer"></path>
          </g>
        </sc-for>
      </svg>
      <sc-for list="{{ CL.texts }}" as="t" hint-placeholder-count="0">
        <div style="position:absolute;left:0;top:0;transform:{{ t.tf }};z-index:{{ CL.z }};pointer-events:none;font-family:'IBM Plex Mono',monospace;font-size:10px;line-height:12px;white-space:pre;opacity:{{ t.op }};text-shadow:0 0 2px #121316,0 0 2px #121316,0 0 3px #121316"><sc-for list="{{ t.parts }}" as="q" hint-placeholder-count="0"><span style="color:{{ q.c }}">{{ q.t }}</span></sc-for></div>
      </sc-for>
      </sc-for>

          <sc-for list="{{ cNodes }}" as="c" hint-placeholder-count="0">
            <div data-node="{{ c.id }}" data-hover="head" style="position:absolute;left:0;top:0;transform:{{ c.tf }};width:{{ c.w }}px;height:{{ c.h }}px;opacity:{{ c.op }};clip-path:{{ c.clip }};border:{{ c.bw }}px solid {{ c.bc }};border-radius:12px;background:{{ c.bg }};pointer-events:auto;cursor:default;z-index:{{ c.z }};box-shadow:{{ c.shadow }}">
              <div data-card="{{ c.id }}" onClick="{{ c.onCard }}" style="display:flex;align-items:center;gap:9px;line-height:{{ c.titleH }}px;height:{{ c.hh }}px;padding:{{ c.padTop }}px {{ c.padLeft }}px 0;pointer-events:auto;cursor:pointer">
                <span style="position:absolute;left:0;right:0;top:{{ c.hh }}px;height:{{ c.ext }}px;pointer-events:auto"></span>
                <span data-head="1" onClick="{{ c.onClick }}" style="position:relative;display:flex;align-items:center;pointer-events:auto;cursor:pointer">
                  <span style="position:absolute;top:calc(({{ c.padTop }}px + {{ c.bw }}px) * -1 - ({{ c.titleH }}px - 100%) / 2);height:{{ c.hitH }}px;left:calc({{ c.padLeft }}px * -1);right:calc({{ c.padLeft }}px * -1);pointer-events:auto"></span>
                  <span style="font-size:{{ c.fs }}px;font-weight:600;color:{{ c.lc }};font-family:'IBM Plex Sans',sans-serif;white-space:nowrap;background:{{ c.lbg }};box-shadow:{{ c.lsh }};text-shadow:{{ c.tsh }};padding:1px 5px;margin:-1px -5px;border-radius:4px" data-ink="1">{{ c.label }}</span>
                  <sc-if value="{{ c.hasMeta }}" hint-placeholder-val="{{ false }}">
                    <span style="margin-left:9px;font-size:9.5px;letter-spacing:.09em;text-transform:uppercase;color:#8d8b85;font-weight:500;white-space:nowrap" data-ink="1">{{ c.meta }}</span>
                  </sc-if>
                  <span style="display:flex;align-items:center;gap:6px;margin-left:{{ c.subGap }}px">
                    <sc-if value="{{ c.glyph }}" hint-placeholder-val="{{ false }}">
                      <svg width="11" height="12" viewBox="0 0 12 13" style="flex:none"><path d="M6 .8 11 3.6v5.8L6 12.2 1 9.4V3.6z" fill="none" stroke="{{ c.ic }}" stroke-width="1.1"></path></svg>
                    </sc-if>
                    <span style="font-size:11.5px;font-weight:600;color:{{ c.subC }};white-space:nowrap" data-ink="1">{{ c.sub }}</span>
                  </span>
                </span>
                <span style="flex:1;align-self:stretch;display:flex;min-width:0"><sc-if value="{{ c.deep }}" hint-placeholder-val="{{ false }}"><span data-deep="1" data-chev="1" onClick="{{ c.onDeep }}" title="{{ c.deepTitle }}" style="flex:1;display:flex;align-items:center;justify-content:center;min-width:16px;color:{{ c.deepC }};pointer-events:auto;cursor:pointer"><svg width="11" height="11" viewBox="0 0 24 24" style="transform:rotate({{ c.deepRot }}deg);filter:{{ c.deepSh }}"><path d="m9 18 6-6-6-6" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"></path></svg></span></sc-if></span></span>
                <sc-if value="{{ c.canFold }}" hint-placeholder-val="{{ false }}">
                <sc-if value="{{ c.spacer }}" hint-placeholder-val="{{ true }}"><span style="flex:none;width:16px"></span></sc-if>
                <span data-chev="1" onClick="{{ c.onFold }}" style="display:flex;align-items:center;justify-content:center;align-self:center;width:16px;height:16px;margin-left:{{ c.chevMl }}px;border-radius:4px;position:relative;color:{{ c.chevC }};background:{{ c.chevBg }};flex:none;pointer-events:auto;cursor:pointer" style-before="content:'';position:absolute;inset:-11px" style-hover="color:{{ chevHoverC }}">
                  <svg width="11" height="11" viewBox="0 0 24 24" style="transform:rotate({{ c.rot }}deg);filter:{{ c.csh }}"><path d="m9 18 6-6-6-6" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"></path></svg>
                </span>
                </sc-if>
              </div>
              <sc-if value="{{ c.rule }}" hint-placeholder-val="{{ false }}">
                <span style="position:absolute;left:{{ c.padLeft }}px;right:{{ c.padLeft }}px;top:{{ c.ruleTop }}px;height:1px;background:{{ c.rc }};pointer-events:none"></span>
              </sc-if>
            </div>
          </sc-for>

          <sc-for list="{{ sNodes }}" as="s" hint-placeholder-count="0">
            <div data-node="{{ s.id }}" data-hover="head" style="position:absolute;left:0;top:0;transform:{{ s.tf }};width:{{ s.w }}px;height:{{ s.h }}px;opacity:{{ s.op }};clip-path:{{ s.clip }};border:{{ s.bw }}px solid {{ s.bc }};border-style:{{ s.bs }};border-radius:10px;background:{{ s.bg }};pointer-events:auto;cursor:default;z-index:{{ s.z }};box-shadow:{{ s.shadow }}">
              <div data-card="{{ s.id }}" onClick="{{ s.onCard }}" style="display:flex;align-items:center;gap:6px;height:{{ s.hh }}px;padding:{{ s.padTop }}px {{ s.padLeft }}px 0;pointer-events:auto;cursor:pointer">
                <span style="position:absolute;left:0;right:0;top:{{ s.hh }}px;height:{{ s.ext }}px;pointer-events:auto"></span>
                <span data-head="1" onClick="{{ s.onClick }}" style="position:relative;display:flex;align-items:center;gap:6px;pointer-events:auto;cursor:pointer">
                  <span style="position:absolute;top:calc(({{ s.padTop }}px + {{ s.bw }}px) * -1 - ({{ s.th }}px - 100%) / 2);height:{{ s.hitH }}px;left:calc({{ s.padLeft }}px * -1);right:calc({{ s.padLeft }}px * -1);pointer-events:auto"></span>
                  <sc-if value="{{ s.glyph }}" hint-placeholder-val="{{ false }}">
                    <svg width="11" height="12" viewBox="0 0 12 13" style="flex:none"><path d="M6 .8 11 3.6v5.8L6 12.2 1 9.4V3.6z" fill="none" stroke="{{ s.ic }}" stroke-width="1.1"></path></svg>
                  </sc-if>
                  <span style="font-size:11.5px;font-weight:600;color:{{ s.lc }};white-space:nowrap;background:{{ s.lbg }};box-shadow:{{ s.lsh }};text-shadow:{{ s.tsh }};padding:1px 5px;margin:-1px -5px;border-radius:4px" data-ink="1">{{ s.label }}</span>
                  <sc-if value="{{ s.hasMeta }}" hint-placeholder-val="{{ false }}">
                    <span style="font-size:10.5px;color:#8d8b85;white-space:nowrap" data-ink="1">{{ s.meta }}</span>
                  </sc-if>
                </span>
                <sc-if value="{{ s.canFold }}" hint-placeholder-val="{{ false }}">
                <sc-if value="{{ s.spacer }}" hint-placeholder-val="{{ true }}"><span style="flex:none;width:16px"></span></sc-if>
                <span style="flex:1;align-self:stretch;display:flex;min-width:0"><sc-if value="{{ s.deep }}" hint-placeholder-val="{{ false }}"><span data-deep="1" data-chev="1" onClick="{{ s.onDeep }}" title="{{ s.deepTitle }}" style="flex:1;display:flex;align-items:center;justify-content:center;min-width:16px;color:{{ s.deepC }};pointer-events:auto;cursor:pointer"><svg width="11" height="11" viewBox="0 0 24 24" style="transform:rotate({{ s.deepRot }}deg);filter:{{ s.deepSh }}"><path d="m9 18 6-6-6-6" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"></path></svg></span></sc-if></span></span>
                <span data-chev="1" onClick="{{ s.onFold }}" style="display:flex;align-items:center;justify-content:center;align-self:center;width:16px;height:16px;margin-left:auto;border-radius:4px;position:relative;color:{{ s.chevC }};background:{{ s.chevBg }};flex:none;pointer-events:auto;cursor:pointer" style-before="content:'';position:absolute;inset:-11px" style-hover="color:{{ chevHoverC }}">
                  <svg width="10" height="10" viewBox="0 0 24 24" style="transform:rotate({{ s.rot }}deg);filter:{{ s.csh }}"><path d="m9 18 6-6-6-6" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"></path></svg>
                </span>
                </sc-if>
              </div>
            </div>
          </sc-for>

          <sc-for list="{{ bandNodes }}" as="b" hint-placeholder-count="0">
            <div style="position:absolute;left:0;top:0;transform:{{ b.tf }};width:{{ b.w }}px;display:flex;flex-direction:column;gap:8px;opacity:{{ b.op }};clip-path:{{ b.clip }};pointer-events:none;z-index:{{ b.z }}">
              <sc-if value="{{ b.hasRule }}" hint-placeholder-val="{{ true }}"><span style="width:100%;height:1px;background:{{ b.rule }}"></span></sc-if>
              <div data-node="{{ b.id }}" data-card="{{ b.id }}" onClick="{{ b.onCard }}" style="display:flex;align-items:center;gap:6px;box-sizing:content-box;height:16px;margin:{{ b.hitUp }}px 3px -8px;padding:{{ b.hitUpP }}px 0 8px;pointer-events:auto;cursor:pointer">
              <span data-head="1" onClick="{{ b.onClick }}" style="display:inline-flex;align-items:center;gap:6px;pointer-events:auto;cursor:pointer">
                <span style="font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;font-weight:600;color:{{ b.lc }};background:{{ b.lbg }};box-shadow:{{ b.lsh }};text-shadow:{{ b.tsh }};padding:1px 5px;margin:-1px -5px;border-radius:4px">{{ b.label }}</span>
                <span style="font-size:9.5px;color:#8d8b85">{{ b.meta }}</span>
              </span>
              <sc-if value="{{ b.canFold }}" hint-placeholder-val="{{ false }}">
              <sc-if value="{{ b.spacer }}" hint-placeholder-val="{{ true }}"><span style="flex:none;width:16px"></span></sc-if>
              <span style="flex:1;align-self:stretch;display:flex;min-width:0"><sc-if value="{{ b.deep }}" hint-placeholder-val="{{ false }}"><span data-deep="1" data-chev="1" onClick="{{ b.onDeep }}" title="{{ b.deepTitle }}" style="flex:1;display:flex;align-items:center;justify-content:center;min-width:16px;color:{{ b.deepC }};pointer-events:auto;cursor:pointer"><svg width="9" height="9" viewBox="0 0 24 24" style="transform:rotate({{ b.deepRot }}deg);filter:{{ b.deepSh }}"><path d="m9 18 6-6-6-6" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"></path></svg></span></sc-if></span>
                <span data-chev="1" onClick="{{ b.onFold }}" style="display:flex;align-items:center;justify-content:center;align-self:center;width:16px;height:16px;margin-left:auto;border-radius:4px;position:relative;color:{{ b.chevC }};background:{{ b.chevBg }};flex:none;pointer-events:auto;cursor:pointer" style-before="content:'';position:absolute;inset:-11px" style-hover="color:{{ chevHoverC }}">
                <svg width="9" height="9" viewBox="0 0 24 24" style="transform:rotate({{ b.rot }}deg);filter:{{ b.csh }}"><path d="m9 18 6-6-6-6" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"></path></svg>
              </span>
              </sc-if>
              </div>
            </div>
          </sc-for>

          <sc-for list="{{ boxNodes }}" as="n" hint-placeholder-count="0">
            <div data-node="{{ n.id }}" data-card="{{ n.id }}" data-head="{{ n.headAll }}" onClick="{{ n.onCard }}" style="position:absolute;left:0;top:0;transform:{{ n.tf }};width:{{ n.w }}px;height:{{ n.h }}px;opacity:{{ n.op }};clip-path:{{ n.clip }};border:{{ n.bw }}px solid {{ n.bc }};border-radius:8px;background:{{ n.bg }};padding:{{ n.pt }}px {{ n.px }}px;display:flex;flex-direction:column;justify-content:{{ n.jc }};gap:{{ n.gap }}px;pointer-events:auto;cursor:pointer;z-index:{{ n.z }};box-shadow:{{ n.shadow }}">
              <div style="display:flex;align-items:center;gap:6px;font-family:'IBM Plex Mono',monospace;font-size:12.5px;font-weight:500;color:{{ n.lc }};white-space:nowrap;line-height:{{ n.labelH }}px;flex:none">
                <span data-head="1" onClick="{{ n.onTitle }}" style="position:relative;cursor:pointer;background:{{ n.lbg }};box-shadow:{{ n.lsh }};text-shadow:{{ n.tsh }};padding:1px 5px;margin:-1px -5px;border-radius:4px"><span style="position:absolute;top:calc({{ n.hitT }}px * -1);height:{{ n.hitH }}px;left:calc({{ n.px }}px * -1);right:calc({{ n.px }}px * -1);pointer-events:auto"></span>{{ n.label }}</span>
                <sc-if value="{{ n.canPin }}" hint-placeholder-val="{{ false }}">
                  <span style="flex:none;width:16px"></span>
                  <span data-chev="1" onClick="{{ n.onPin }}" title="{{ n.pinTitle }}" style="display:flex;align-items:center;justify-content:center;width:15px;height:15px;margin-left:auto;border-radius:4px;position:relative;color:{{ n.chevC }};background:{{ n.chevBg }};flex:none;pointer-events:auto;cursor:pointer" style-before="content:'';position:absolute;inset:-8px" style-hover="color:{{ chevHoverC }}">
                    <svg width="12" height="12" viewBox="0 0 24 24" style="filter:{{ n.csh }}"><path d="M13 2 4.5 13.5H12L11 22l8.5-11.5H12z" fill="{{ n.pinFill }}" stroke="currentColor" stroke-width="2" stroke-linejoin="round"></path></svg>
                  </span>
                </sc-if>
                <sc-if value="{{ n.canFold }}" hint-placeholder-val="{{ false }}">
                  <span style="flex:none;width:16px"></span>
                <span data-chev="1" onClick="{{ n.onFold }}" style="display:flex;align-items:center;justify-content:center;width:15px;height:15px;margin-left:auto;border-radius:4px;position:relative;color:{{ n.chevC }};background:{{ n.chevBg }};flex:none;pointer-events:auto;cursor:pointer" style-before="content:'';position:absolute;inset:-8px" style-hover="color:{{ chevHoverC }}">
                    <svg width="11" height="11" viewBox="0 0 24 24" style="transform:rotate({{ n.rot }}deg);filter:{{ n.csh }}"><path d="m9 18 6-6-6-6" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"></path></svg>
                  </span>
                </sc-if>
              </div>
              <sc-if value="{{ n.hasRows }}" hint-placeholder-val="{{ false }}">
                <div style="display:flex;flex-direction:column;flex:0 1 auto;min-height:0;overflow:hidden;padding:3px 0;margin:-3px 0">
                  <sc-for list="{{ n.rows }}" as="r" hint-placeholder-count="0">
                    <div data-node="{{ r.id }}" data-head="1" onClick="{{ r.onClick }}" style="display:flex;align-items:center;gap:8px;font-family:'IBM Plex Mono',monospace;font-size:11px;line-height:{{ n.rowH }}px;color:{{ r.c }};white-space:nowrap;margin:0 -6px;padding:0 6px;border-radius:4px;background:{{ r.bg }};opacity:{{ r.op }}">
                      <span style="width:{{ n.dot }}px;height:{{ n.dot }}px;border-radius:50%;flex:none;background:{{ r.dc }}"></span><span style="background:{{ r.lbg }};box-shadow:{{ r.lsh }};text-shadow:{{ r.tsh }};padding:1px 5px;margin:-1px -5px;border-radius:4px">{{ r.label }}</span>
                    </div>
                  </sc-for>
                </div>
              </sc-if>
            </div>
          </sc-for>

          <sc-for list="{{ chipNodes }}" as="p" hint-placeholder-count="0">
            <div data-node="{{ p.id }}" data-head="1" onClick="{{ p.onClick }}" style="position:absolute;left:0;top:0;transform:{{ p.tf }};width:{{ p.w }}px;height:{{ p.h }}px;opacity:{{ p.op }};clip-path:{{ p.clip }};border:{{ p.bw }}px solid {{ p.bc }};border-radius:7px;background:{{ p.bg }};display:flex;align-items:center;padding:0 {{ p.px }}px;pointer-events:auto;cursor:pointer;z-index:{{ p.z }};box-shadow:{{ p.shadow }}">
              <span style="font-family:'IBM Plex Mono',monospace;font-size:12px;color:{{ p.lc }};white-space:nowrap;background:{{ p.lbg }};box-shadow:{{ p.lsh }};text-shadow:{{ p.tsh }};padding:1px 5px;margin:-1px -5px;border-radius:4px">{{ p.label }}</span>
            </div>
          </sc-for>

          <sc-for list="{{ textNodes }}" as="t" hint-placeholder-count="0">
            <div data-node="{{ t.id }}" data-head="1" onClick="{{ t.onClick }}" style="position:absolute;left:0;top:0;transform:{{ t.tf }};width:{{ t.w }}px;height:{{ t.h }}px;opacity:{{ t.op }};clip-path:{{ t.clip }};display:flex;align-items:center;font-family:'IBM Plex Mono',monospace;font-size:11.5px;color:{{ t.lc }};white-space:nowrap;pointer-events:auto;cursor:pointer;z-index:{{ t.z }};border-radius:4px;box-shadow:{{ t.shadow }};text-shadow:{{ t.tsh }};background:{{ t.lbg }}">{{ t.label }}</div>
          </sc-for>

          <sc-for list="{{ foldNodes }}" as="f" hint-placeholder-count="0">
            <div data-node="{{ f.id }}" data-card="{{ f.id }}" onClick="{{ f.onCard }}" style="position:absolute;left:0;top:0;transform:{{ f.tf }};width:{{ f.w }}px;height:{{ f.h }}px;opacity:{{ f.op }};clip-path:{{ f.clip }};border:{{ f.bw }}px solid {{ f.bc }};border-radius:11px;background:{{ f.bg }};pointer-events:auto;cursor:pointer;z-index:{{ f.z }};box-shadow:{{ f.shadow }}">
              <div style="display:flex;align-items:center;gap:9px;line-height:{{ f.titleH }}px;height:{{ f.hh }}px;padding:{{ f.padTop }}px {{ f.px }}px 0">
                <span data-head="1" onClick="{{ f.onTitle }}" style="position:relative;display:flex;align-items:baseline;flex:none;white-space:nowrap;cursor:pointer">
                  <span style="position:absolute;top:calc(({{ f.padTop }}px + {{ f.bw }}px) * -1 - ({{ f.titleH }}px - 100%) / 2);height:{{ f.h }}px;left:calc({{ f.px }}px * -1);right:calc({{ f.px }}px * -1);pointer-events:auto"></span>
                  <span style="font-size:13.5px;font-weight:600;color:{{ f.lc }};font-family:'IBM Plex Sans',sans-serif;white-space:nowrap;background:{{ f.lbg }};box-shadow:{{ f.lsh }};text-shadow:{{ f.tsh }};padding:1px 5px;margin:-1px -5px;border-radius:4px" data-ink="1">{{ f.label }}</span>
                </span>
                <sc-if value="{{ f.canFold }}" hint-placeholder-val="{{ false }}">
                <span style="flex:none;width:16px"></span>
                <span data-chev="1" onClick="{{ f.onFold }}" style="display:flex;align-items:center;justify-content:center;align-self:center;width:16px;height:16px;margin-left:auto;border-radius:4px;position:relative;color:{{ f.chevC }};background:{{ f.chevBg }};flex:none;pointer-events:auto;cursor:pointer" style-before="content:'';position:absolute;inset:-11px" style-hover="color:{{ chevHoverC }}">
                  <svg width="11" height="11" viewBox="0 0 24 24" style="transform:rotate({{ f.rot }}deg);filter:{{ f.csh }}"><path d="m9 18 6-6-6-6" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"></path></svg>

              </div>
            </div>
          </sc-for>



        </div>
      </div>

      <div style="position:absolute;left:14px;top:12px;display:flex;align-items:center;gap:10px;height:32px;padding:0 12px;border-radius:9px;background:#16171a;border:1px solid #26282d;opacity:{{ chromeOp }};transition:opacity .2s;z-index:1">
        <svg width="15" height="15" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="2" fill="none" stroke="#8d8b85" stroke-width="1.75"></rect><rect x="14" y="14" width="7" height="7" rx="2" fill="none" stroke="#8d8b85" stroke-width="1.75"></rect><path d="M10 6.5h3.5a3 3 0 0 1 3 3V14" fill="none" stroke="#8d8b85" stroke-width="1.75"></path></svg>
        <span style="font-size:13px;font-weight:600;color:#e6e4df">deblob</span>
        <sc-if value="{{ projSingle }}" hint-placeholder-val="{{ true }}">
          <span style="font-size:12px;color:#8d8b85">{{ breadcrumb }}</span>
        </sc-if>
        <sc-if value="{{ projMany }}" hint-placeholder-val="{{ false }}">
          <div style="position:relative;display:flex">
            <button onClick="{{ projToggle }}" title="Switch project" style="display:flex;align-items:center;gap:6px;height:24px;margin:0 -6px;padding:0 6px;border:0;border-radius:6px;background:{{ projBtnBg }};color:#c4c2bc;font:inherit;font-size:12px;cursor:pointer" style-hover="background:#1e2024;color:#e6e4df">

              <svg width="10" height="10" viewBox="0 0 10 10"><path d="M2.5 4l2.5 2.5L7.5 4" fill="none" stroke="#8d8b85" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"></path></svg>
            </button>
            <sc-if value="{{ projOpen }}" hint-placeholder-val="{{ false }}">
              <div onClick="{{ projClose }}" style="position:fixed;inset:0;z-index:40"></div>
              <div role="listbox" style="position:absolute;left:-6px;top:30px;z-index:41;min-width:220px;display:flex;flex-direction:column;gap:1px;padding:4px;border-radius:8px;background:#18191d;border:1px solid #2c2f35;box-shadow:0 8px 24px rgba(0,0,0,.4)">
                <sc-for list="{{ projList }}" as="p" hint-placeholder-count="2">
                  <button role="option" onClick="{{ p.pick }}" style="display:flex;align-items:center;justify-content:space-between;gap:16px;height:28px;padding:0 8px;border:0;border-radius:5px;background:{{ p.bg }};color:{{ p.c }};font:inherit;font-size:12px;text-align:left;cursor:pointer" style-hover="background:#1e2024;color:#e6e4df">
                    <span>{{ p.label }}</span>
                    <span style="font-family:'IBM Plex Mono',monospace;font-size:10px;color:#5a5d64">{{ p.id }}</span>
                  </button>
                </sc-for>
              </div>
            </sc-if>
          </div>
        </sc-if>
      </div>

      <div style="position:absolute;left:14px;right:calc({{ bpW }}px + 84px);top:12px;width:fit-content;margin-left:auto;display:flex;flex-wrap:wrap;align-items:center;justify-content:flex-end;gap:10px 14px;padding:7px 12px;border-radius:9px;background:#16171a;border:1px solid #26282d;font-size:11.5px;color:#8d8b85;opacity:{{ chromeOp }};transition:opacity .2s,right 260ms cubic-bezier(.2,.7,.2,1)">
        <sc-for list="{{ legend }}" as="g" hint-placeholder-count="6">
          <button onClick="{{ g.onClick }}" title="{{ g.title }}" style="display:flex;align-items:center;gap:6px;font-size:11.5px;white-space:nowrap;color:{{ g.fg }}"><span style="width:7px;height:7px;border-radius:50%;background:{{ g.c }}"></span>{{ g.k }}</button>
        </sc-for>
        <button onClick="{{ toggleDirs }}" title="Directory containers" style="display:flex;align-items:center;gap:6px;font-size:11.5px;white-space:nowrap;color:{{ dirsFg }}">
          <span style="width:7px;height:7px;border-radius:50%;background:{{ dirsDot }}"></span>directory
        </button>
        <button onClick="{{ toggleHex }}" title="Hexagon container" style="display:flex;align-items:center;gap:6px;font-size:11.5px;white-space:nowrap;color:{{ hexFg }}"><span style="width:7px;height:7px;border-radius:50%;background:{{ hexDot }}"></span>hexagon</button>
        <span style="width:1px;height:18px;background:#24262b"></span>
        <div style="display:flex;flex-wrap:wrap;align-items:center;gap:10px">
          <sc-for list="{{ toggles }}" as="t" hint-placeholder-count="3">
            <button onClick="{{ t.onClick }}" title="{{ t.title }}" style="display:flex;align-items:center;gap:6px;font-size:11.5px;white-space:nowrap;color:{{ t.fg }}">
              <span style="width:14px;height:0;border-top:2px {{ t.style }} {{ t.dot }}"></span>{{ t.label }}
            </button>
          </sc-for>
        </div>
      </div>

      <div style="position:absolute;left:12px;right:calc({{ bpW }}px + 12px);bottom:14px;width:fit-content;margin:0 auto;display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:5px;padding:7px 9px;border-radius:11px;background:#16171a;border:1px solid #26282d;opacity:{{ chromeOp }};transition:opacity .2s,right 260ms cubic-bezier(.2,.7,.2,1)">
        <button onClick="{{ toggleChain }}" title="Chain select: clicks add to the selection" style="width:26px;height:26px;border-radius:7px;display:flex;align-items:center;justify-content:center;background:{{ chainBg }};color:{{ chainFg }}"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="1.5" y="1.5" width="8" height="8" rx="1.5"></rect><rect x="6.5" y="6.5" width="8" height="8" rx="1.5"></rect></svg></button>
        <button onClick="{{ toggleZoomSel }}" title="Show only participants" style="width:26px;height:26px;border-radius:7px;display:flex;align-items:center;justify-content:center;background:{{ zoomSelBg }};color:{{ zoomSelFg }}"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><circle cx="8" cy="8" r="4.5"></circle><path d="M8 1v2.5M8 12.5V15M1 8h2.5M12.5 8H15"></path><circle cx="8" cy="8" r="1" fill="currentColor" stroke="none"></circle></svg></button>
        <span style="width:1px;height:20px;background:#24262b;margin:0 4px"></span>
        <button onClick="{{ toggleFlow }}" title="Flow direction" style="width:26px;height:26px;border-radius:7px;display:flex;align-items:center;justify-content:center;color:#c4c2bc"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="{{ flowPath }}"></path></svg></button>
        <button onClick="{{ toggleAspect }}" title="Fit layout to view shape" style="width:26px;height:26px;border-radius:7px;display:flex;align-items:center;justify-content:center;background:{{ aspectBg }};color:{{ aspectFg }}"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"><rect x="1.5" y="3.5" width="13" height="9" rx="1.5"></rect><path d="M5.5 6v4M8 6v4M10.5 6v4"></path></svg></button>
        <span style="width:1px;height:20px;background:#24262b;margin:0 4px"></span>
        <div title="Fold depth" style="display:flex;align-items:center;gap:2px;height:26px;padding:0 4px;white-space:nowrap">
          <button onClick="{{ depthDown }}" title="Coarser (C)" style="width:26px;height:26px;border-radius:7px;display:flex;align-items:center;justify-content:center;color:{{ depthDownC }};cursor:{{ depthDownCur }}"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"><rect x="2.5" y="2.5" width="11" height="11" rx="2"></rect></svg></button>
          <div role="slider" tabindex="0" aria-label="Fold depth" style="position:relative;display:flex;height:26px">
            <span style="position:absolute;left:12px;width:{{ depthDeadW }};top:12px;height:2px;background:#232529"></span>
            <span style="position:absolute;left:{{ depthTrackLeft }};right:12px;top:12px;height:2px;background:#33363d"></span>
            <span style="position:absolute;left:{{ depthTrackLeft }};top:12px;height:2px;background:#8d8b85;width:{{ depthFill }};transition:width .25s ease"></span>
            <span style="position:absolute;left:{{ depthCurLeft }};width:{{ depthCurW }};top:8px;height:10px;border-radius:5px;background:#f1efe9;box-shadow:0 0 0 3px #16171a;z-index:2;pointer-events:none;transition:left .25s ease, width .25s ease"></span>
            <sc-for list="{{ depthStops }}" as="st" hint-placeholder-count="5">
              <button onClick="{{ st.onClick }}" title="{{ st.title }}" style="width:24px;height:26px;display:flex;align-items:center;justify-content:center;position:relative;z-index:1;cursor:{{ st.cursor }}">
                <span style="border-radius:50%;width:{{ st.d }};height:{{ st.d }};background:{{ st.bg }};box-shadow:{{ st.ring }}"></span>
              </button>
            </sc-for>
          </div>
          <button onClick="{{ depthUp }}" title="Finer (E)" style="width:26px;height:26px;border-radius:7px;display:flex;align-items:center;justify-content:center;color:{{ depthUpC }};cursor:{{ depthUpCur }}"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"><rect x="1.5" y="1.5" width="13" height="13" rx="2"></rect><rect x="4" y="4" width="3.5" height="3.5" rx=".8" fill="currentColor" stroke="none"></rect><rect x="8.5" y="4" width="3.5" height="3.5" rx=".8" fill="currentColor" stroke="none"></rect><rect x="4" y="8.5" width="3.5" height="3.5" rx=".8" fill="currentColor" stroke="none"></rect></svg></button>
        </div>
        <span style="width:1px;height:20px;background:#24262b;margin:0 4px"></span>
        <div title="Motion while the map changes" style="display:flex;align-items:center;gap:2px;height:26px;padding:0 4px;white-space:nowrap">
          <button onClick="{{ toggleMotionAuto }}" title="Auto motion: less detail when transitions get jaggy" style="width:26px;height:26px;border-radius:7px;display:flex;align-items:center;justify-content:center;font-size:11.5px;font-weight:600;font-family:'IBM Plex Mono',monospace;background:{{ motionAutoBg }};color:{{ motionAutoFg }}">A</button>
          <button onClick="{{ motionDown }}" title="Less motion" style="width:26px;height:26px;border-radius:7px;display:flex;align-items:center;justify-content:center;color:#c4c2bc"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><circle cx="8" cy="8" r="3"></circle></svg></button>
          <div role="slider" tabindex="0" aria-label="Motion" style="position:relative;display:flex;height:26px">
            <span style="position:absolute;left:12px;right:12px;top:12px;height:2px;background:#33363d"></span>
            <span style="position:absolute;left:12px;top:12px;height:2px;background:#8d8b85;width:{{ motionFill }}"></span>
            <sc-for list="{{ motionStops }}" as="st" hint-placeholder-count="4">
              <button onClick="{{ st.onClick }}" title="{{ st.title }}" style="width:24px;height:26px;display:flex;align-items:center;justify-content:center;position:relative;z-index:1;cursor:pointer">
                <span style="border-radius:50%;width:{{ st.d }};height:{{ st.d }};background:{{ st.bg }};box-shadow:{{ st.ring }}"></span>
              </button>
            </sc-for>
          </div>
          <button onClick="{{ motionUp }}" title="More motion" style="width:26px;height:26px;border-radius:7px;display:flex;align-items:center;justify-content:center;color:#c4c2bc"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><circle cx="10.5" cy="8" r="3"></circle><path d="M1.5 6h3M1.5 10h3M3 8h2.5"></path></svg></button>
        </div>
        <span style="width:1px;height:20px;background:#24262b;margin:0 4px"></span>
        <div title="Arrows and boxes" style="display:flex;align-items:center;gap:2px;height:26px;padding:0 4px;white-space:nowrap">
          <button onClick="{{ arrowZDown }}" title="Boxes first" style="width:26px;height:26px;border-radius:7px;display:flex;align-items:center;justify-content:center;color:#c4c2bc"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"><rect x="2" y="2.5" width="12" height="11" rx="2"></rect><path d="M2 6.2h12"></path></svg></button>
          <div role="slider" tabindex="0" aria-label="Arrows and boxes" style="position:relative;display:flex;height:26px">
            <span style="position:absolute;left:12px;right:12px;top:12px;height:2px;background:#33363d"></span>
            <span style="position:absolute;left:12px;top:12px;height:2px;background:#8d8b85;width:{{ arrowZFill }}"></span>
            <sc-for list="{{ arrowZStops }}" as="st" hint-placeholder-count="4">
              <button onClick="{{ st.onClick }}" title="{{ st.title }}" style="width:24px;height:26px;display:flex;align-items:center;justify-content:center;position:relative;z-index:1;cursor:pointer">
                <span style="border-radius:50%;width:{{ st.d }};height:{{ st.d }};background:{{ st.bg }};box-shadow:{{ st.ring }}"></span>
              </button>
            </sc-for>
          </div>
          <button onClick="{{ arrowZUp }}" title="Arrows first" style="width:26px;height:26px;border-radius:7px;display:flex;align-items:center;justify-content:center;color:#c4c2bc"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M1.5 4.5H4c3 0 3.5 7 6.5 7h4M12.5 9.5l2 2-2 2"></path><path d="M1.5 11.5H4c3 0 3.5-7 6.5-7h4M12.5 2.5l2 2-2 2"></path></svg></button>
        </div>
        <span style="width:1px;height:20px;background:#24262b;margin:0 4px"></span>
        <button onClick="{{ togglePassBoxes }}" title="Arrows through boxes" style="width:26px;height:26px;border-radius:7px;display:flex;align-items:center;justify-content:center;background:{{ passBoxesBg }};color:{{ passBoxesFg }}"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="4.5" y="4.5" width="7" height="7" rx="1.2"></rect><path d="M1 8h14"></path></svg></button>
        <button onClick="{{ togglePassInside }}" title="Arrows through layers" style="width:26px;height:26px;border-radius:7px;display:flex;align-items:center;justify-content:center;background:{{ passInsideBg }};color:{{ passInsideFg }}"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="1.5" y="1.5" width="13" height="13" rx="2"></rect><rect x="6" y="6" width="4" height="4" rx=".8"></rect><path d="M4 8h8"></path></svg></button>
        <button onClick="{{ toggleBundles }}" title="Merge same target arrows" style="width:26px;height:26px;border-radius:7px;display:flex;align-items:center;justify-content:center;background:{{ bundlesBg }};color:{{ bundlesFg }}"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M2 3.5h4.5a2 2 0 0 1 2 2v0a2 2 0 0 0 2 2H14"></path><path d="M2 8h12"></path><path d="M2 12.5h4.5a2 2 0 0 0 2-2v0a2 2 0 0 1 2-2H14"></path></svg></button>
        <span style="width:1px;height:20px;background:#24262b;margin:0 4px"></span>

        <button onClick="{{ zoomOut }}" title="Zoom out" style="width:26px;height:26px;border-radius:7px;font-size:15px;color:#c4c2bc">−</button>
        <button onClick="{{ zoomReset }}" title="Reset zoom to 100%" style="min-width:42px;height:26px;border-radius:7px;text-align:center;font-size:11.5px;color:#8d8b85;font-family:'IBM Plex Mono',monospace" style-hover="color:#f4f2ec;background:#24262b"><span data-map="zoompct">{{ zoomPct }}</span></button>
        <button onClick="{{ zoomIn }}" title="Zoom in" style="width:26px;height:26px;border-radius:7px;font-size:15px;color:#c4c2bc">+</button>
        <button onClick="{{ fit }}" title="Fit to view" style="height:26px;padding:0 10px;border-radius:7px;font-size:12px;color:#c4c2bc">Fit</button>
        <button onClick="{{ toggleWheelZoom }}" title="Mouse wheel zooms" style="width:26px;height:26px;border-radius:7px;display:flex;align-items:center;justify-content:center;background:{{ wheelZoomBg }};color:{{ wheelZoomFg }}"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="1.5" width="8" height="13" rx="4"></rect><path d="M8 4.5v2.5"></path></svg></button>

      </div>
      <dc-import name="Behavior Panel" graph="{{ bpGraph }}" sel="{{ bpSel }}" on-width="{{ onBpW }}" chrome-op="{{ chromeOp }}" hint-size="100%,100%" style="position:absolute;inset:0;pointer-events:none;z-index:3"></dc-import>
    </main>

    <div ref="{{ dockRef }}" onMouseEnter="{{ dockEnter }}" onMouseLeave="{{ dockLeave }}" style="flex:none;position:relative;height:{{ dockPx }}px;overflow:hidden;background:#16171a;box-shadow:inset 0 1px 0 #26282d;transition:{{ dockTr }}">
      <div onPointerDown="{{ onDockDown }}" title="Drag to resize" style="position:absolute;left:0;right:0;top:0;height:5px;cursor:ns-resize;z-index:10"></div>
      <dc-import name="Sequence Panel" embedded="{{ true }}" hooks="{{ seqHooks }}" hook="{{ seqHook }}" fn="{{ seqFn }}" snapshot="{{ seqSnapshot }}" step-tier="{{ seqStepTier }}" part-tier="{{ seqPartTier }}" on-calls="{{ onSeqCalls }}" pick-call="{{ seqPick }}" clear-sel="{{ seqClear }}" map-part="{{ seqMapPart }}" on-part="{{ onSeqPart }}" hint-size="100%,100%" style="position:absolute;left:0;right:0;top:1px;bottom:0"></dc-import>
    </div>

  </div>
</div>

          rows: its.map(i => ({
            label: this.byId[i] ? this.byId[i].label : i, meta: this.byId[i] ? this.byId[i].group : '',
            color: KIND[this.byId[i] ? this.byId[i].group : 'blob'], style: 'solid',
            onClick: () => this.select(i), onEnter: () => this.hover(i), onLeave: () => this.hover(null),
          })),
        });
      }
      const out = this.edges.filter(e => mine.has(e.from) && !mine.has(e.to));
      const inc = this.edges.filter(e => mine.has(e.to) && !mine.has(e.from));
      if (out.length) insp.inspSections.push({ title: 'reaches', meta: `${out.length}`, rows: out.map(row) });
      if (inc.length) insp.inspSections.push({ title: 'reached by', meta: `${inc.length}`, rows: inc.map(row) });
    }

    return {
      ...empty, ...insp, ready: true, insp: !!(sel || edgeSel || synth || member), noSel: !(sel || edgeSel || synth || member),
      cam: `translate(${s.pan.x.toFixed(1)}px,${s.pan.y.toFixed(1)}px) scale(${s.k.toFixed(3)})`,
      // Frozen pointer during a tween: hover state, CSS hover and clicks all wait;
      // the tween's last step runs repaintHover() as the catch-up.
      camPE: this.tweening ? 'none' : 'auto',
      gridPos: `${s.pan.x.toFixed(0)}px ${s.pan.y.toFixed(0)}px`,
      cursor: s.dragging ? 'grabbing' : s.spaceHeld ? 'grab' : 'default',
      chromeOp: s.dragging ? 0.3 : 1, bpW: s.bpW || 0, bpGraph: this.g, bpSel: s.sel, onBpW: this.onBpW,
      ...(() => { const q = this.seqOf(s); return { seqHooks: q.hooks, seqHook: q.hook, seqFn: q.fn, dockPx: this.seqSrc() && this.seqOpen(q) ? this.dockH0() : 0 }; })(),
      dockTr: 'height .24s cubic-bezier(.2,.7,.2,1)', dockRef: this.dockRef, dockEnter: this.dockEnter, dockLeave: this.dockLeave, onDockDown: this.onDockDown,
      seqStepTier, seqPartTier, seqPick: s.seqPick || null, onSeqCalls: this.onSeqCalls, seqClear: s.seqClear || 0, seqMapPart: this.mapPartOf(s.sel), onSeqPart: this.onSeqPart,
      cNodes, sNodes, bandNodes, boxNodes, chipNodes, textNodes, foldNodes, edgeLayers, callLayers: [{ z: 0, arcs: callArcsLo, texts: callTextsLo }, { z: stack.order.length + 2, arcs: callArcs, texts: callTexts }],
      toggles, navDrivers, navBoxes, hasDrivers: navDrivers.length > 0,
      legend: [['service', 'service'], ['port', 'ports'], ['model', 'model'], ['adapter', 'adapters'], ['driver', 'driver'], ['assembly', 'assembly']].map(([k, g]) => ({
        k, c: this.kindOn(g) ? SC.kind[g] : '#3b3e45', fg: this.kindOn(g) ? '#c4c2bc' : '#5a5d64',
        title: `Show ${k} boxes`, onClick: () => this.toggleKind(g),
      })),
      ...(() => {
        const auto = this.motionPick() === 'auto', mi = motionIdx(this.motionMode());
        return {
          toggleMotionAuto: this.toggleMotionAuto, motionDown: this.motionDown, motionUp: this.motionUp,
          motionAutoBg: auto ? '#2b2d33' : 'transparent', motionAutoFg: auto ? '#f4f2ec' : '#c4c2bc',
          motionFill: mi * 24 + 'px',
          motionStops: MOTION_STOPS.map(([v, label], i) => ({
            title: label, onClick: () => this.setMotion(v),
            d: i === mi ? '10px' : '6px', bg: i === mi ? '#f1efe9' : '#8d8b85', ring: i === mi ? '0 0 0 3px #16171a' : 'none',
          })),
        };
      })(),
      toggleWheelZoom: this.toggleWheelZoom, wheelZoomBg: s.wheelZoom ? '#2b2d33' : 'transparent', wheelZoomFg: s.wheelZoom ? '#f4f2ec' : '#c4c2bc',
      zoomPct: Math.round(s.k / ZOOM_BASE * 100) + '%',
      onOver: this.onOver, onOut: this.onOut,
      detail: Math.min(s.detail ?? 3, LEVELS.length - 1), detailMax: LEVELS.length - 1, setDetail: this.setDetail,
      detailLabel: LEVEL_LABEL[LEVELS[Math.min(s.detail ?? 3, LEVELS.length - 1)]],
      schemeBg: SC.bg, chevHoverC: SC.ink,
      zoomSelBg: s.zoomSel ? '#2b2d33' : 'transparent', zoomSelFg: s.zoomSel ? '#f4f2ec' : '#c4c2bc',
      toggleChain: this.toggleChain, chainBg: s.chain ? '#2b2d33' : 'transparent', chainFg: s.chain ? '#f4f2ec' : '#c4c2bc',
      // The glyph shows the current flow (the map shows it too); the tooltip names the action.
      togglePassBoxes: this.togglePassBoxes, togglePassInside: this.togglePassInside, toggleBundles: this.toggleBundles,
      cvLoZ: (s.arrowZ ?? 2) >= 3 ? 1 : 0, cvHiZ: (s.arrowZ ?? 2) >= 2 ? 1 : 0,
      arrowZDown: this.arrowZDown, arrowZUp: this.arrowZUp, arrowZFill: (s.arrowZ ?? 2) * 24 + 'px',
      arrowZStops: ARROWZ_STOPS.map((label, i) => { const on = i === (s.arrowZ ?? 2); return { title: label, onClick: () => this.setArrowZ(i), d: on ? '10px' : '6px', bg: on ? '#f1efe9' : '#8d8b85', ring: on ? '0 0 0 3px #16171a' : 'none' }; }),
      toggleAspect: this.toggleAspect, aspectBg: s.aspect ? '#2b2d33' : 'transparent', aspectFg: s.aspect ? '#f4f2ec' : '#c4c2bc',
      bundlesBg: s.bundles !== false ? '#2b2d33' : 'transparent', bundlesFg: s.bundles !== false ? '#f4f2ec' : '#c4c2bc',
      passBoxesBg: s.passBoxes ? '#2b2d33' : 'transparent', passBoxesFg: s.passBoxes ? '#f4f2ec' : '#c4c2bc',
      passInsideBg: s.passInside ? '#2b2d33' : 'transparent', passInsideFg: s.passInside ? '#f4f2ec' : '#c4c2bc',
      flowPath: this.dirH() ? 'M2 8h11M9.5 4.5L13 8l-3.5 3.5' : 'M8 2v11M4.5 9.5L8 13l3.5-3.5',
      fit: this.fit, setDepth: this.setDepth, depthMax: DEPTHS.length - 1, depth: depthInfo.d, depthLabel: DEPTH_LABEL[DEPTHS[depthInfo.d]] + (depthInfo.exact ? '' : ' ·'),
      depthDown: this.depthDown, depthUp: this.depthUp, depthFill: Math.max(0, (depthCx1 + depthCx2) / 2 - (this.depthMin() * 24 + 12)) + 'px',
      depthCurLeft: depthCx1 - 5 + 'px', depthCurW: depthCx2 - depthCx1 + 10 + 'px',
      depthDownC: depthInfo.minus == null ? '#4a4c52' : '#c4c2bc', depthUpC: depthInfo.plus == null ? '#4a4c52' : '#c4c2bc',
      depthDownCur: depthInfo.minus == null ? 'default' : 'pointer', depthUpCur: depthInfo.plus == null ? 'default' : 'pointer',
      depthDeadW: this.depthMin() * 24 + 'px', depthTrackLeft: this.depthMin() * 24 + 12 + 'px',
      depthStops: DEPTHS.map((k, i) => {
        const off = i < this.depthMin();
        return {
          title: DEPTH_LABEL[k][0].toUpperCase() + DEPTH_LABEL[k].slice(1) + (off ? ' (directories hidden)' : ''),
          onClick: off ? () => {} : () => this.goDepth(i),
          cursor: off ? 'default' : 'pointer',
          d: '6px',
          bg: off ? 'transparent' : '#8d8b85',
          ring: off ? 'inset 0 0 0 1px #3b3e45' : 'none',
        };
      }),
      toggleDirs: this.toggleDirs, toggleHex: this.toggleHex,
      hexFg: s.hex !== false ? '#c4c2bc' : '#5a5d64', hexDot: s.hex !== false ? '#8d8b85' : '#3b3e45',
      dirsFg: s.dirs !== false ? '#c4c2bc' : '#5a5d64', dirsDot: s.dirs !== false ? '#8d8b85' : '#3b3e45',
      zoomReset: this.zoomReset, zoomIn: () => this.zoomBy(1.18), zoomOut: () => this.zoomBy(1 / 1.18), toggleZoomSel: this.toggleZoomSel, toggleFlow: this.toggleFlow,
      onDown: this.onDown, onMove: this.onMove, onUp: this.onUp, onDbl: this.onDbl, onCtx: this.onCtx,
    };
  }
}
