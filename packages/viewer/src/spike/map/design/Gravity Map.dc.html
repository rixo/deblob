<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>html,body{margin:0;height:100%;background:#121316;color:#e6e4df;font-family:'IBM Plex Sans',system-ui,sans-serif;-webkit-font-smoothing:antialiased;overflow:hidden}*{box-sizing:border-box}button{font-family:inherit;background:none;border:0;padding:0;color:inherit;cursor:pointer}a{color:#cfcdc7}a:hover{color:#f4f2ec}</style>
<script src="map-consts.js"></script>
<script src="map-theme.js"></script>
<script src="box-spec.js"></script>
<script src="place-sandbox.js"></script>
<script src="gravity-layout.js"></script>
</helmet>
<div ref="{{ canvasRef }}" onPointerDown="{{ onDown }}" onPointerMove="{{ onMove }}" onPointerUp="{{ onUp }}" onDoubleClick="{{ onDbl }}" style="position:fixed;inset:0;overflow:hidden;user-select:none;-webkit-user-select:none;background-color:#121316;background-image:radial-gradient(#24262b 1px,transparent 1px);background-size:20px 20px;cursor:{{ cursor }}">
  <div ref="{{ worldRef }}" style="position:absolute;left:0;top:0;transform-origin:0 0;visibility:{{ worldVis }}">
    <sc-for list="{{ dirBoxes }}" as="b" hint-placeholder-count="0">
      <div data-slot="{{ b.id }}" style="position:absolute;z-index:{{ b.z }};left:{{ b.x }}px;top:{{ b.y }}px;width:{{ b.w }}px;height:{{ b.h }}px;opacity:{{ b.op }};pointer-events:{{ b.pe }};transform:scale({{ b.sc }});transform-origin:50% 50%">
        <dc-import name="Map - Box" id="{{ b.id }}" tier="{{ b.tier }}" kind="{{ b.kind }}" title="{{ b.title }}" pre="{{ b.pre }}" icon="{{ b.icon }}" open="{{ b.open }}" rows="{{ b.rows }}" actions="{{ b.actions }}" state="{{ b.state }}" sel="{{ b.sel }}" sel-rows="{{ b.selRows }}" on-select-row="{{ b.onRow }}" on-select="{{ b.onSelect }}" on-action="{{ b.onAction }}" on-hover="{{ b.onHover }}" hint-size="100%,100%" style="position:absolute;inset:0"></dc-import>
      </div>
    </sc-for>
    <svg width="1" height="1" style="position:absolute;z-index:1;left:0;top:0;overflow:visible;pointer-events:none;opacity:{{ linkOp }};transition:opacity 140ms">
      <sc-for list="{{ hitsUnder }}" as="l" hint-placeholder-count="0">
        <path d="{{ l.d }}" fill="none" stroke="transparent" stroke-width="8" pointer-events="{{ l.pe }}" onMouseEnter="{{ l.onEnter }}" onMouseLeave="{{ l.onLeave }}" style="cursor:pointer"></path>
      </sc-for>
      <sc-for list="{{ tethers }}" as="l" hint-placeholder-count="0">
        <path d="{{ l.d }}" fill="{{ l.c }}" stroke="none" opacity="{{ l.op }}"></path>
      </sc-for>
      <sc-for list="{{ linksUnder }}" as="l" hint-placeholder-count="0">
        <path d="{{ l.d }}" fill="none" stroke="{{ l.c }}" stroke-width="{{ l.sw }}" opacity="{{ l.op }}"></path>
      </sc-for>
    </svg>
    <sc-for list="{{ boxes }}" as="b" hint-placeholder-count="0">
      <div data-slot="{{ b.id }}" style="position:absolute;z-index:{{ b.z }};left:{{ b.x }}px;top:{{ b.y }}px;width:{{ b.w }}px;height:{{ b.h }}px;opacity:{{ b.op }};pointer-events:{{ b.pe }};transform:scale({{ b.sc }});transform-origin:50% 50%">
        <dc-import name="Map - Box" id="{{ b.id }}" tier="{{ b.tier }}" kind="{{ b.kind }}" title="{{ b.title }}" pre="{{ b.pre }}" icon="{{ b.icon }}" open="{{ b.open }}" rows="{{ b.rows }}" actions="{{ b.actions }}" state="{{ b.state }}" sel="{{ b.sel }}" sel-rows="{{ b.selRows }}" on-select-row="{{ b.onRow }}" on-select="{{ b.onSelect }}" on-action="{{ b.onAction }}" on-hover="{{ b.onHover }}" hint-size="100%,100%" style="position:absolute;inset:0"></dc-import>
      </div>
    </sc-for>
    <svg width="1" height="1" style="position:absolute;z-index:3;left:0;top:0;overflow:visible;pointer-events:none;opacity:{{ linkOp }};transition:opacity 140ms">
      <sc-for list="{{ linksOver }}" as="l" hint-placeholder-count="0">
        <path d="{{ l.d }}" fill="none" stroke="{{ l.c }}" stroke-width="{{ l.sw }}" opacity="{{ l.op }}"></path>
      </sc-for>
      <sc-for list="{{ hitsOver }}" as="l" hint-placeholder-count="0">
        <path d="{{ l.d }}" fill="none" stroke="transparent" stroke-width="8" pointer-events="{{ l.pe }}" onMouseEnter="{{ l.onEnter }}" onMouseLeave="{{ l.onLeave }}" style="cursor:pointer"></path>
      </sc-for>
    </svg>
  </div>

  <div data-ui="info" style="position:absolute;left:14px;top:12px;display:flex;align-items:baseline;gap:10px;padding:8px 12px;border-radius:9px;background:#16171a;border:1px solid #26282d">
    <span style="font-size:13px;font-weight:600;color:#e6e4df;white-space:nowrap">Gravity map</span>
    <span style="font:400 11.5px 'IBM Plex Mono',monospace;color:#8d8b85;white-space:nowrap">{{ graphName }}</span>
  </div>

  <div data-ui="bar" style="position:absolute;left:12px;right:12px;bottom:14px;width:fit-content;margin:0 auto;display:flex;align-items:center;gap:4px;padding:6px 8px;border-radius:11px;white-space:nowrap;background:#16171a;border:1px solid #26282d">
    <button onClick="{{ toggleFocus }}" title="Show only the selection and its neighbours (space)" style="width:26px;height:26px;border-radius:7px;display:flex;align-items:center;justify-content:center;background:{{ focusBg }};color:{{ focusFg }}"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><circle cx="8" cy="8" r="4.5"></circle><path d="M8 1v2.5M8 12.5V15M1 8h2.5M12.5 8H15"></path><circle cx="8" cy="8" r="1" fill="currentColor" stroke="none"></circle></svg></button>
    <button onClick="{{ toggleCentre }}" title="Centre the focus" style="width:26px;height:26px;border-radius:7px;display:flex;align-items:center;justify-content:center;background:{{ centreBg }};color:{{ centreFg }}"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M1.5 5.5v-2.5a1.5 1.5 0 0 1 1.5-1.5h2.5M10.5 1.5h2.5a1.5 1.5 0 0 1 1.5 1.5v2.5M14.5 10.5v2.5a1.5 1.5 0 0 1-1.5 1.5h-2.5M5.5 14.5h-2.5a1.5 1.5 0 0 1-1.5-1.5v-2.5"></path><circle cx="8" cy="8" r="1.5" fill="currentColor" stroke="none"></circle></svg></button>
    <button onClick="{{ toggleChain }}" title="Chain select: clicks add to the selection (or shift + click)" style="width:26px;height:26px;border-radius:7px;display:flex;align-items:center;justify-content:center;background:{{ chainBg }};color:{{ chainFg }}"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="1.5" y="1.5" width="8" height="8" rx="1.5"></rect><rect x="6.5" y="6.5" width="8" height="8" rx="1.5"></rect></svg></button>
    <span style="width:1px;height:20px;background:#24262b;margin:0 4px"></span>
    <button onClick="{{ toggleFlow }}" title="Flow constraint: importers left of what they import (between units)" style="height:26px;padding:0 10px;border-radius:7px;font-size:12px;display:flex;align-items:center;gap:6px;background:{{ flowBg }};color:{{ flowFg }}"><svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M2 8h11M9.5 4.5L13 8l-3.5 3.5"></path></svg>flow</button>
    <button onClick="{{ toggleDirs }}" title="Directories as boxes; off: each directory is a star its units are pulled toward" style="height:26px;padding:0 10px;border-radius:7px;font-size:12px;background:{{ dirsBg }};color:{{ dirsFg }}">dir boxes</button>
    <span style="width:1px;height:20px;background:#24262b;margin:0 4px"></span>
    <sc-for list="{{ stops }}" as="s" hint-placeholder-count="4">
      <button onClick="{{ s.onClick }}" title="+ / − keys: one level more or less (selection, else shown, else all). / : back to layers, selection exempt" style="height:26px;padding:0 10px;border-radius:7px;font-size:12px;background:{{ s.bg }};color:{{ s.fg }}">{{ s.label }}</button>
    </sc-for>
    <span style="width:1px;height:20px;background:#24262b;margin:0 4px"></span>
    <sc-for list="{{ arrowStops }}" as="s" hint-placeholder-count="4">
      <button onClick="{{ s.onClick }}" title="{{ s.title }}" style="height:26px;padding:0 9px;border-radius:7px;font-size:12px;background:{{ s.bg }};color:{{ s.fg }}">{{ s.label }}</button>
    </sc-for>
    <span style="width:1px;height:20px;background:#24262b;margin:0 4px"></span>
    <button onClick="{{ fit }}" style="height:26px;padding:0 10px;border-radius:7px;font-size:12px;color:#c4c2bc">Fit</button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;graph&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;deblob-seq&quot;,&quot;deblob-fine&quot;,&quot;ai-tools&quot;],&quot;default&quot;:&quot;deblob-seq&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;spread&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;min&quot;:40,&quot;max&quot;:260,&quot;step&quot;:5,&quot;default&quot;:110,&quot;tsType&quot;:&quot;number&quot;,&quot;unit&quot;:&quot;px&quot;},&quot;fusion&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;},&quot;dirLabels&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;fusion&quot;,&quot;galaxy&quot;,&quot;none&quot;],&quot;default&quot;:&quot;galaxy&quot;,&quot;tsType&quot;:&quot;'fusion' | 'galaxy' | 'none'&quot;},&quot;dirRoots&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;lib&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;gap&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;min&quot;:10,&quot;max&quot;:80,&quot;step&quot;:2,&quot;default&quot;:28,&quot;tsType&quot;:&quot;number&quot;,&quot;unit&quot;:&quot;px&quot;},&quot;stability&quot;:{&quot;editor&quot;:&quot;float&quot;,&quot;min&quot;:0,&quot;max&quot;:3,&quot;step&quot;:0.05,&quot;default&quot;:0,&quot;tsType&quot;:&quot;number&quot;},&quot;orbit&quot;:{&quot;editor&quot;:&quot;float&quot;,&quot;min&quot;:0,&quot;max&quot;:3,&quot;step&quot;:0.05,&quot;default&quot;:0.5,&quot;tsType&quot;:&quot;number&quot;},&quot;cohesion&quot;:{&quot;editor&quot;:&quot;float&quot;,&quot;min&quot;:0.1,&quot;max&quot;:2,&quot;step&quot;:0.05,&quot;default&quot;:0.6,&quot;tsType&quot;:&quot;number&quot;},&quot;galaxy&quot;:{&quot;editor&quot;:&quot;float&quot;,&quot;min&quot;:0.1,&quot;max&quot;:5,&quot;step&quot;:0.1,&quot;default&quot;:1,&quot;tsType&quot;:&quot;number&quot;},&quot;energy&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;stress&quot;,&quot class Component extends DCLogic {

  }
  componentWillUnmount() { this.flush(); window.removeEventListener('keydown', this.onKey); window.removeEventListener('pagehide', this.flush); document.removeEventListener('visibilitychange', this.onVis); }

  readJSON(k) { try { return JSON.parse(localStorage.getItem(k) || 'null'); } catch (e) { return null; } }
  set(patch) { this.setState(patch); this.save(); }

    let h = 2166136261; for (let i = 0; i < t.length; i++) { h ^= t.charCodeAt(i); h = Math.imul(h, 16777619); } return (h >>> 0).toString(36);

  // The drawn closed box (card or folded box) nearest the screen centre, and
  // its centre's screen offset from the screen centre.

    const c = this.cam, cx = (W / 2 - c.x) / c.k, cy = (H / 2 - c.y) / c.k; let best = null, bd = Infinity;
    for (const [id, r] of this.cur.L) { if (r.open) continue; const d = Math.hypot(r.x + r.w / 2 - cx, r.y + r.h / 2 - cy); if (d < bd) { bd = d; best = { id, dx: (r.x + r.w / 2 - cx) * c.k, dy: (r.y + r.h / 2 - cy) * c.k }; } }

  restoreState() {

    const st = {

      arrows: ARROWS.some(a => a[0] === C.arrows) ? C.arrows : this.state.arrows, chain: !!C.chain, focus: !!C.focus, centre: !!C.centre,
      depth: C.depth === null || (Number.isInteger(C.depth) && C.depth >= 0 && C.depth <= 4) ? C.depth : 2,
    };
    if (!st.dirs && st.depth === 0) st.depth = 1;
    if (V && Array.isArray(V.folded)) { st.folded = V.folded.filter(id => M.nodes.has(id)); st.cards = (V.cards || []).filter(id => M.nodes.has(id)); st.sel = (V.sel || []).filter(has); }
    else { const d = st.depth ?? 2; st.folded = [...this.PS.foldAt(M, Math.min(d, 3))]; st.cards = d >= 4 ? this.withRows : []; st.sel = []; }
    return { st, V };
  }
  placeCamera(V, s) {
    const W = this._el.clientWidth, H = this._el.clientHeight, L = this.cur.L;
    const ok = v => typeof v === 'number' && isFinite(v);
    if (V && ok(V.k) && ok(V.cx) && ok(V.cy) && V.fp === this.fp(s)) { const k = V.k; this.cam = { k, x: W / 2 - V.cx * k, y: H / 2 - V.cy * k }; }
    else if (V && ok(V.k) && V.anchor && L.has(V.anchor.id)) { const r = L.get(V.anchor.id), k = V.k; this.cam = { k, x: W / 2 + V.anchor.dx - (r.x + r.w / 2) * k, y: H / 2 + V.anchor.dy - (r.y + r.h / 2) * k }; }
    else { this.fit(); return; }
    const c = this.cam, onScreen = [...L.values()].some(r => { const x = r.x * c.k + c.x, y = r.y * c.k + c.y; return x < W && y < H && x + r.w * c.k > 0 && y + r.h * c.k > 0; });

  // + / − (Session 46p): open or fold one level, on the selection and what
  // it holds; else, under focus, on the shown boxes; else on everything.

  onKey = ev => {

  // / (Session 46r): back to the layers stop (units open, layers folded, no

      for (const id of s.sel) for (let p = M.nodes.get(this.base(id)) && M.nodes.get(this.base(id)).parent; p && M.nodes.has(p); p = M.nodes.get(p).parent) F.delete(p);
