<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">

<x-dc>
<helmet>

</helmet>
<div ref="{{ rootRef }}" style="position:absolute;inset:0;pointer-events:none;overflow:hidden;font-family:'IBM Plex Sans',system-ui,sans-serif">
  <div data-ui="pill" style="position:absolute;top:12px;right:{{ pillR }}px;height:32px;padding:0 3px;display:flex;align-items:center;gap:2px;border-radius:9px;background:#16171a;border:1px solid #26282d;transition:right 260ms cubic-bezier(.2,.7,.2,1), opacity .2s;pointer-events:auto;z-index:1;opacity:{{ chromeOp }}">

        <div style="display:flex;align-items:center;gap:9px;min-width:0">

        </div>
      </sc-if>

            </div>

        </div>
      </sc-if>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;graph&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;object&quot;},&quot;sel&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;string | null&quot;},&quot;onWidth&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;(px: number) =&gt; void&quot;},&quot;chromeOp&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;number&quot;}}">

const seg = (t, c, mono, big, deco) => ({ t, ff: mono ? MONO : SANS, fs: mono ? (big ? '12.5px' : '12px') : (big ? '13.5px' : '13px'), fsS: mono ? '11.5px' : '12.5px', c, deco: deco || 'none' });

// README blocks (reply to FROM-DEBLOB ask 4): { h, level? } · { p } · { ul | ol: [text | { t, ul | ol }] }

const NB = { isH: false, isP: false, isList: false, isCode: false, isTable: false, segs: [], items: [], lines: [], rows: [], hfs: '13px' };

const cap = (s) => { if (s[0] && s[0].ff === SANS) s[0] = { ...s[0], t: s[0].t[0].toUpperCase() + s[0].t.slice(1) }; return s; };

const gapCode = (F) => F.gap.lines.map(l => ({ t: `${l.n}  ${l.t}`, c: l.u ? INK : DIM, bg: l.u ? 'rgba(255,192,67,.12)' : 'transparent' }));

    const key = (k) => (sel || '') + '|' + k;

    const note = (t, c) => ({ pad: 0, mt: '0px', fst: 'normal', fw: 400, segs: segsOf(t, c), deco: 'none', cur: 'default', bgc: 'transparent', dig: '', digOp: 0,
      onClick: () => {}, onEnter: () => {}, onLeave: () => {}, hasNote: false, note: [], hasCode: false, code: [], hasGot: false, got: '', where: '' });
    // Ask 5: `known: false` = behavior not extracted yet (no mark, said once);
    // known with an empty tree = nothing describes it (flagged, amber).
    const groupOf = (F, gid, name, look) => {
      if (F.known === false) return { rows: [note('Behavior not extracted yet.', MUTE)], failing: false, gap: false, unknown: true };
      if (!(F.tree || []).length) return { rows: [note('No behavior describes it.', AMB)], failing: false, gap: true, empty: true };
      const rows = outline(F).map(r => {
        const leaf = r.type === 'it' || r.type === 'test', k = key(gid + ':' + r.id);
        const on = S.aOpen === k, hov = S.aHov === k, fail = !!r.node.fail;
        return { ...rowLook(r), segs: sentence(r),
          deco: fail ? `underline wavy ${RED} 1px` : 'none', cur: leaf ? 'pointer' : 'default',
          bgc: on ? 'rgba(255,255,255,.05)' : (hov && leaf ? 'rgba(255,255,255,.03)' : 'transparent'),
          dig: on ? 'hide' : 'code', digOp: leaf && (hov || on) ? 1 : 0,
          onClick: leaf ? () => set({ aOpen: on ? null : k }) : () => {},
          onEnter: () => set({ aHov: k }), onLeave: () => { if (this.state.aHov === k) set({ aHov: null }); },
          hasNote: fail, note: fail ? segsOf(r.node.fail.note, RED2, false) : [],
          hasCode: on && leaf, code: on && leaf ? codeFor(F, name, r.id) : [],
          hasGot: on && fail, got: fail ? r.node.fail.got : '', where: `${look.spec}:${r.node.line || ''}` };
      });
      if (F.gap) {
        const k = key(gid + ':gap'), on = S.aOpen === k, hov = S.aHov === k;
        rows.push({ pad: 0, mt: '16px', fst: 'normal', fw: 400, segs: segsOf(F.gap.t, AMB), deco: 'none', cur: 'pointer',
          bgc: on ? 'rgba(255,255,255,.05)' : (hov ? 'rgba(255,255,255,.03)' : 'transparent'),
          dig: on ? 'hide' : 'code', digOp: hov || on ? 1 : 0,
          onClick: () => set({ aOpen: on ? null : k }), onEnter: () => set({ aHov: k }), onLeave: () => { if (this.state.aHov === k) set({ aHov: null }); },
          hasNote: false, note: [], hasCode: on, code: on ? gapCode(F) : [], hasGot: false, got: '', where: F.gap.where });
      }
      const failing = anyFail(F.tree);
      return { rows, failing, gap: !!F.gap };
    };
    const specOf = (it) => String(it.file || it.id).split('/').pop().replace(/(\.[a-z]+)$/, '.spec$1');
    const fnDoc = (it, s) => { const F = BL.fnFor(it.id, s.name); return BL.authored(it.id, s.name) ? F.doc || s.doc : s.doc || F.doc; };

    let head = null, readme = null, groups = [];
    if (subj && subj.kind !== 'box') {
      const it = subj.it, kc = KC[it.group] || MUTE;
      if (subj.kind === 'member') {
        const s = subj.sym, fn = s.form === 'function';
        head = { title: s.name + (fn ? '()' : ''), path: it.file || it.id, doc: fnDoc(it, s), sq: kc, mono: true };
        if (fn) { const g = groupOf(BL.fnFor(it.id, s.name), s.name, s.name, { spec: specOf(it) });
          groups = [{ ...g, showHead: false, open: true, gpad: '0', rule: 'transparent', rowsPad: '0' }]; }
      } else {
        head = { title: it.label, path: it.file || it.id, doc: BL.docFor(it.id) || it.doc, sq: kc, mono: true };
        groups = fnSyms(it).map((s, i) => ({ ...groupOf(BL.fnFor(it.id, s.name), s.name, s.name, { spec: specOf(it) }),
          showHead: true, foldable: false, open: true, name: s.name + '()', kc, doc: segsOf(fnDoc(it, s), INK2, false), docPad: 15, cur: 'default',
          gpad: i ? '12px 0 4px' : '0 0 4px', rule: i ? '#22242a' : 'transparent', rowsPad: '6px 0 2px 0', onToggle: () => {} }));
      }
    } else if (subj) {
      const c = subj.c, L = subj.layer, lk = L === 'hexagon' ? HEX : L ? [L] : null;
      head = { title: c.label, path: c.id, layer: L, layerC: L === 'hexagon' ? '#e8c26a' : (KC[L] || MUTE), sq: null, mono: false };
      readme = L ? null : BL.readmeFor(c.id);
      const inC = (it) => c.id === '.' || it.c === c.id || String(it.c).startsWith(c.id + '/');
      const fns = [];
      for (const it of ix.list) if (inC(it) && (!lk || lk.includes(it.group))) for (const s of fnSyms(it)) fns.push([it, s]);
      groups = fns.map(([it, s], i) => {
        const gid = it.id + '#' + s.name, k = key('g:' + gid), on = !!S.gOpen[k], F = BL.fnFor(it.id, s.name);
        const g = on ? groupOf(F, gid, s.name, { spec: specOf(it) }) : { rows: [], failing: anyFail(F.tree || []), gap: F.known !== false && (!!F.gap || !(F.tree || []).length) };
        return { ...g, showHead: true, foldable: true, open: on, name: s.name + '()', kc: KC[it.group] || MUTE,
          doc: segsOf(fnDoc(it, s), INK2, false), docPad: 17, cur: 'pointer', rot: on ? 90 : 0,
          hasFlag: !on && (g.failing || g.gap), flag: g.failing ? 'One behavior does not hold.' : (F.tree || []).length ? 'Part of it is not described by any behavior.' : 'No behavior describes it.', flagC: g.failing ? RED2 : AMB,
          gpad: '8px 0', rule: i ? '#22242a' : 'transparent', rowsPad: '6px 0 2px 17px',
          onToggle: () => set({ gOpen: { ...this.state.gOpen, [k]: !on } }) };
      });
    } else if (open && BL) {
      const m = (P.graph && P.graph.meta) || {};
      head = { proj: true, title: m.project || '', path: (P.label || m.breadcrumb || '') + ' · README', sq: null, mono: false };
      readme = BL.readmeFor('.');
    }

    return {
      pillR: open ? W + 14 : 14, panelX: open ? '0px' : 'calc(100% + 40px)', chromeOp: P.chromeOp ?? 1,
      panelBg: open ? '#26282d' : 'transparent', panelC: open ? INK : MUTE, panelTitle: open ? 'Close panel' : 'Open panel',
      pinBg: S.pin ? '#26282d' : 'transparent', pinC: S.pin ? INK : MUTE, pinTitle: S.pin ? 'Unpin: follow the selection' : 'Keep open',
      onPanel: () => set({ manual: { sel, open: !open }, pin: open ? false : S.pin }),
      onPin: () => set({ pin: !S.pin, manual: null }),
      stop: (e) => e.stopPropagation(), rootRef: this.rootRef,
      hasHead: !!head, isProj: !!(head && head.proj), hasSq: !!(head && head.sq) || !!(head && !head.proj && !head.sq),
      sqBg: head && head.sq ? head.sq : 'transparent', sqBd: head && head.sq ? 'none' : 'inset 0 0 0 1.5px #cfcdc7',
      titleFont: head && head.mono ? "500 15px 'IBM Plex Mono',monospace" : "600 15px 'IBM Plex Sans',sans-serif",
      title: head ? head.title : '', path: head ? head.path : '',
      hasLayer: !!(head && head.layer), layer: head ? head.layer || '' : '', layerC: (head && head.layerC) || MUTE,
      hasDoc: !!(head && head.doc), docSegs: head && head.doc ? segsOf(head.doc, INK2) : [],
      hasReadme: !!readme, readme: blocks(readme),
      rmPad: groups.length ? '18px' : '0', rmRule: groups.length ? '#22242a' : 'transparent',
      hasBeh: groups.length > 0, groups,
    };
  }
}
</script>
</body>
